name: Integration Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 2 * * *"

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run end-to-end integration tests
        working-directory: tether-app
        run: |
          python -m pytest tests/integration -v

      - name: Run full test suite
        working-directory: tether-app
        run: |
          python -m pytest tests/ -v

      - name: Validate carrier bypass config
        working-directory: tether-app
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "shared")
          from models import CarrierBypassConfig
          cfg = CarrierBypassConfig()
          assert cfg.ttl_value == 65
          assert cfg.ipv6_blocking is True
          assert cfg.dns_leak_prevention is True
          assert cfg.mss_mtu_clamping is True
          assert cfg.mss_value == 1360
          print("Carrier bypass config OK")
          PY

      - name: Security vulnerability scan (bandit)
        working-directory: tether-app
        run: |
          pip install bandit || true
          bandit -r linux-client/src shared -f txt -o bandit-report.txt || true
          cat bandit-report.txt 2>/dev/null || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: tether-app/.pytest_cache/
