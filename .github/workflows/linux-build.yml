name: Linux Client Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pytest pyyaml

      - name: Lint Linux client source
        run: |
          flake8 linux-client/src linux-client/ui tests shared || true

      - name: Format check
        run: |
          black --check linux-client/src linux-client/ui tests shared || true

      - name: Run Python unit tests
        run: |
          python -m pytest tests/ -v

      - name: Verify connection script syntax
        run: |
          bash -n linux-client/scripts/connect.sh
          bash -n linux-client/scripts/disconnect.sh
          bash -n linux-client/scripts/gui.sh