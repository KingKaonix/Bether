name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [21, 28, 34]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          echo "GRADLE_HOME=$PWD/gradle-8.2" >> $GITHUB_ENV
          echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Build Android debug APK
        working-directory: tether-app/android-app
        run: ./gradlew assembleDebug

      - name: Run unit tests
        working-directory: tether-app/android-app
        run: ./gradlew testDebugUnitTest

      - name: Lint (debug)
        working-directory: tether-app/android-app
        run: ./gradlew lintDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tether-app-debug-api-${{ matrix.api-level }}
          path: tether-app/android-app/app/build/outputs/apk/debug/*.apk
